<!-- Yaqinlashib kelayotgan vazifalar -->
{% if upcoming_tasks %}
<div class="card" style="margin-top:24px;">
    <div class="card-header">
        <h3 class="card-title">📆 Yaqin 7 kun</h3>
        <a href="{% url 'task_list' %}" class="btn btn-secondary btn-sm">Barchasini ko'rish</a>
    </div>
    <div style="overflow-x:auto;">
        <table style="width:100%; border-collapse:collapse; font-size:14px;">
            <thead>
                <tr style="border-bottom:1px solid #E5E7EB;">
                    <th style="text-align:left; padding:10px; color:#6B7280; font-weight:500;">Vazifa</th>
                    <th style="text-align:left; padding:10px; color:#6B7280; font-weight:500;">Muddat</th>
                    <th style="text-align:left; padding:10px; color:#6B7280; font-weight:500;">Muhimlik</th>
                    <th style="text-align:left; padding:10px; color:#6B7280; font-weight:500;">Holat</th>
                </tr>
            </thead>
            <tbody>
                {% for task in upcoming_tasks %}
                <tr style="border-bottom:1px solid #F3F4F6;">
                    <td style="padding:10px;">
                        <a href="{% url 'task_edit' task.id %}" style="color:#2D2D3A; text-decoration:none; font-weight:500;">
                            {{ task.title }}
                        </a>
                    </td>
                    <td style="padding:10px; color:#6B7280;">{{ task.due_date|date:"d.m.Y" }}</td>
                    <td style="padding:10px;"><span class="badge badge-{{ task.priority }}">{{ task.get_priority_display }}</span></td>
                    <td style="padding:10px;"><span class="badge badge-{{ task.status }}">{{ task.get_status_display }}</span></td>
                </tr>
                {% endfor %}
            </tbody>
        </table>
    </div>
</div>
{% endif %}
