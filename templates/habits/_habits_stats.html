<!-- Statistika -->
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;">
    <div class="card" style="padding:18px;display:flex;align-items:center;gap:14px;">
        <div style="width:44px;height:44px;border-radius:12px;background:rgba(247,37,133,.15);display:flex;align-items:center;justify-content:center;font-size:1.3rem;">🔥</div>
        <div>
            <div style="font-size:11px;color:#9CA3AF;font-weight:600;text-transform:uppercase;">Jami Odatlar</div>
            <div style="font-size:1.8rem;font-weight:800;color:#f72585;">{{ total }}</div>
        </div>
    </div>
    <div class="card" style="padding:18px;display:flex;align-items:center;gap:14px;">
        <div style="width:44px;height:44px;border-radius:12px;background:rgba(6,214,160,.15);display:flex;align-items:center;justify-content:center;font-size:1.3rem;">✅</div>
        <div>
            <div style="font-size:11px;color:#9CA3AF;font-weight:600;text-transform:uppercase;">Bugun Bajarildi</div>
            <div style="font-size:1.8rem;font-weight:800;color:#06d6a0;">{{ done_today }}/{{ total }}</div>
        </div>
    </div>
    <div class="card" style="padding:18px;display:flex;align-items:center;gap:14px;">
        <div style="width:44px;height:44px;border-radius:12px;background:rgba(255,190,11,.15);display:flex;align-items:center;justify-content:center;font-size:1.3rem;">📅</div>
        <div>
            <div style="font-size:11px;color:#9CA3AF;font-weight:600;text-transform:uppercase;">Bugun</div>
            <div style="font-size:14px;font-weight:700;color:#2D2D3A;">{{ today|date:"d MMMM, Y" }}</div>
        </div>
    </div>
</div>
