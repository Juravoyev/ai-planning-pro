<!-- Info cards -->
<div style="display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:24px;">
    <div class="card" style="padding:18px;display:flex;align-items:center;gap:14px;">
        <div style="width:44px;height:44px;border-radius:12px;background:rgba(108,99,255,.15);display:flex;align-items:center;justify-content:center;font-size:1.2rem;">📅</div>
        <div>
            <div style="font-size:12px;color:#9CA3AF;font-weight:600;text-transform:uppercase;">Faol Jadvallar</div>
            <div style="font-size:1.8rem;font-weight:800;color:#6C63FF;">{{ active_count }}</div>
        </div>
    </div>
    <div class="card" style="padding:18px;display:flex;align-items:center;gap:14px;">
        <div style="width:44px;height:44px;border-radius:12px;background:rgba(6,214,160,.15);display:flex;align-items:center;justify-content:center;font-size:1.2rem;">▶️</div>
        <div>
            <div style="font-size:12px;color:#9CA3AF;font-weight:600;text-transform:uppercase;">Hozir</div>
            <div style="font-size:14px;font-weight:700;color:#2D2D3A;">
                {% if current_class %}{{ current_class.icon }} {{ current_class.title }}{% else %}Dars yo'q{% endif %}
            </div>
        </div>
    </div>
    <div class="card" style="padding:18px;display:flex;align-items:center;gap:14px;">
        <div style="width:44px;height:44px;border-radius:12px;background:rgba(243,156,18,.15);display:flex;align-items:center;justify-content:center;font-size:1.2rem;">⏭️</div>
        <div>
            <div style="font-size:12px;color:#9CA3AF;font-weight:600;text-transform:uppercase;">Keyingi dars</div>
            <div style="font-size:14px;font-weight:700;color:#2D2D3A;">
                {% if next_class %}{{ next_class.icon }} {{ next_class.title }} — {{ next_class.start_time|time:"H:i" }}{% else %}Yo'q{% endif %}
            </div>
        </div>
    </div>
</div>
